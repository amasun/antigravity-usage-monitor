name: Sync Upstream

on:
  schedule:
    # Daily at 02:00 UTC (10:00 UTC+8)
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'amasun/antigravity-usage-monitor'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check upstream updates
        id: check
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/yuhuan-dev/antigravity-usage-monitor.git 2>/dev/null \
            || git remote set-url upstream https://github.com/yuhuan-dev/antigravity-usage-monitor.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/main." >> "$GITHUB_STEP_SUMMARY"
          else
            UPSTREAM_SHA=$(git rev-parse --short upstream/main)
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
            echo "Found upstream updates at \`${UPSTREAM_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge upstream, rebuild bundle, test, and push
        if: steps.check.outputs.has_updates == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          LANG: zh_CN.UTF-8
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff upstream/main || true

          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICTS" ]; then
            NON_BUNDLE_CONFLICTS=""
            while IFS= read -r file; do
              case "$file" in
                sidecars/panel/app.js|sidecars/panel/styles.css)
                  ;;
                *)
                  NON_BUNDLE_CONFLICTS="${NON_BUNDLE_CONFLICTS}${file}"$'\n'
                  ;;
              esac
            done <<< "$CONFLICTS"

            if [ -n "$NON_BUNDLE_CONFLICTS" ]; then
              {
                echo "### Merge conflicts detected"
                echo "Automatic sync aborted because non-bundle files have conflicts:"
                echo '```'
                printf '%s' "$NON_BUNDLE_CONFLICTS"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Merge conflicts in non-bundle files; aborting sync."
              git merge --abort
              exit 1
            fi
          fi

          npm --prefix sidecars/panel run build
          git add sidecars/panel/app.js sidecars/panel/styles.css

          npm --prefix sidecars/panel test

          git commit -m "chore(sync): merge upstream/main (${UPSTREAM_SHA})"
          git push origin main

          PLUGIN_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plugin.json', 'utf8')).version)")
          {
            echo "### Sync succeeded"
            echo "- Upstream commit: \`${UPSTREAM_SHA}\`"
            echo "- Plugin version: \`${PLUGIN_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
